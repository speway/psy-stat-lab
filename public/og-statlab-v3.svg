<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">СтатЛаб — статистика для психологов</title>
  <desc id="description">Интерактивный тренажёр по статистике в фирменной индиго-аквамариновой гамме</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24205F"/>
      <stop offset="0.58" stop-color="#312D74"/>
      <stop offset="1" stop-color="#45409A"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BC5C0"/>
      <stop offset="1" stop-color="#A5DED9"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#AFA9E8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#17143D" flood-opacity="0.45"/>
    </filter>
    <clipPath id="chartClip">
      <rect x="790" y="386" width="315" height="122" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1060" cy="84" r="185" fill="#7BC5C0" opacity="0.055"/>
  <circle cx="1035" cy="85" r="128" fill="none" stroke="#E9B44C" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="1040" cy="497" r="230" fill="#524BA7" opacity="0.22"/>

  <rect x="30" y="30" width="1140" height="570" rx="22" fill="none" stroke="#7BC5C0" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M30 112H1170" stroke="#7BC5C0" stroke-opacity="0.22"/>
  <path d="M744 112V600" stroke="#7BC5C0" stroke-opacity="0.18"/>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="74" y="82" fill="#A5DED9" font-size="18" font-weight="700" letter-spacing="2.2">НАУЧНЫЙ СЕКТОР ПСИХОЛОГИИ · ТФ МГУ</text>
    <circle cx="1124" cy="71" r="8" fill="#E9B44C"/>

    <text x="72" y="243" fill="#F8F8FF" font-size="112" font-weight="700" letter-spacing="-5">СТАТЛАБ</text>
    <rect x="75" y="271" width="146" height="8" rx="4" fill="#E9B44C"/>
    <rect x="233" y="271" width="56" height="8" rx="4" fill="#7BC5C0"/>

    <text x="74" y="330" fill="#A5DED9" font-size="23" font-weight="700" letter-spacing="1.6">ИНТЕРАКТИВНЫЙ ТРЕНАЖЁР</text>
    <text x="74" y="367" fill="#F8F8FF" font-size="23" font-weight="700" letter-spacing="1.6">ПО СТАТИСТИКЕ ДЛЯ ПСИХОЛОГОВ</text>

    <text x="75" y="421" fill="#D7D4F4" font-size="18">Критерии · модели · психометрика · практика</text>

    <g filter="url(#shadow)">

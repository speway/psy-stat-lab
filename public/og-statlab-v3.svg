    <circle cx="958" cy="208" r="11" fill="#E9B44C"/>
    <circle cx="1090" cy="286" r="8" fill="#7BC5C0"/>
    <circle cx="851" cy="164" r="6" fill="#AAA4E3"/>
    <path d="M818 343C856 314 894 327 929 293C964 259 998 277 1027 240C1058 201 1084 213 1115 170" fill="none" stroke="#7BC5C0" stroke-width="4" stroke-linecap="round"/>
